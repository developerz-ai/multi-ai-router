# yaml-language-server: $schema=https://developerz.ai/schemas/maintainer.v1.json
# developerz.ai maintainer policy: developerz-ai/multi-ai-router
#
# AI-maintained: the agent triages, answers, reviews and closes what has stalled, and merges on
# green for its own and the dependency bots' pull requests. Releases stay with release.yml: nothing here publishes.
version: 1

# `bin/check` refuses to run without a Postgres, so a box with none would claim this repo's coding
# work and discard every diff at the gate. Declaring it routes the work to a box that can grade it.
services: [postgres]

tone:
  voice: friendly
  language: en

triage:
  ask_for_repro: true
  required_fields: [steps, expected, actual, version]
  qualify_into: [bug, feature, dupe, question, docs]
  close_unanswered_repro_after_days: 14
  stale_after_days: 30
  stale_action: comment_then_close
  non_goals:
    - "Re-routing or substituting a model the client picked: the client picks the model, the router picks the account"
    - "The Agent SDK executing a tool on the router's host: passthrough only, allowlisted by name"
    - "Upstream credentials in a response, a log, an error or an admin endpoint"
    - "Buffering a stream, parsing a passthrough body, or touching Postgres on the request path"
    - "A message broker: background work is in-process with Postgres advisory locks"
    - "Outside human contributors' changes to CI, release or publish automation (.github/, bin/verify-version): members maintain that pipeline"

handoff:
  mode: fleet
  ask_reporter_first: false

pr:
  wait_for_other_bots: [coderabbit]
  # Named so the agent knows which red check is the author's to fix. Re-check against the
  # repo's protection and `.github/workflows/` when either changes; this list is not the ruleset.
  required_checks:
    - "lint"
    - "typecheck"
    - "test"
    - "bench"
    - "build"
    - "ui-geometry"
  auto_merge: true
  # An outside contributor's pull request and a member's wait for a member.
  auto_merge_scope: own_and_dependency_bots
  require_review: true
  close_awaiting_author_after_days: 21

review:
  force: true # without this the native review defers to CodeRabbit where CodeRabbit is active

release:
  # `none`: there is no release manager. Empty channels: the agent publishes nothing itself.
  manager: none
  channels: []

escalate:
  # A human decides a breaking change. The platform's hardcoded asks (security, license, CLA) stay.
  ask_before_acting: [breaking_change]

schedules:
  # Weekly and judged, so a merge never cuts a release. Thursday: one weekday per repo in the fleet.
  - name: release-due
    days: [thu]
    hours_utc: [3]
    brief_file: .dz/briefs/release-due.md
  # The one exception, so a confirmed security fix does not wait up to a week for the slot above.
  - name: security-release
    days: [mon, tue, wed, fri, sat, sun]
    hours_utc: [5]
    brief_file: .dz/briefs/security-release.md
  # Weekly: CI, review and security are event-driven or have their own daily slot above.
  - name: health
    days: [mon]
    hours_utc: [7]
    brief_file: .dz/briefs/health.md
  - name: improve
    days: [mon]
    hours_utc: [8]
    brief_file: .dz/briefs/improve.md

name: ci

on:
  push:
    branches: [main]
  pull_request:

# One CI run per ref. A force-push or a new commit on an open PR cancels the
# in-flight run instead of queueing behind it — the older result is already
# stale by definition.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pinned once here so lint/typecheck/test/build all agree on a runtime. Bun
  # minor releases change `bun test` and bundler behaviour often enough that
  # `latest` would make CI non-reproducible; bump this deliberately, and keep it
  # inside the `oven/bun:1` family the Dockerfile builds against so the image
  # and CI never diverge on runtime semantics.
  BUN_VERSION: "1.3.0"
  # Biome/Vite colourise when they detect a TTY; Actions is not one, so force it
  # for readable log output.
  FORCE_COLOR: "1"

# Default for every job: read-only. Jobs that push packages widen this locally.
permissions:
  contents: read

jobs:
  lint:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      # `--frozen-lockfile` fails instead of silently rewriting bun.lock, so a
      # PR that edits a package.json without committing the lockfile is caught
      # here rather than producing a different dependency tree in the image.
      - run: bun install --frozen-lockfile
      # `biome check` is lint + format + import-sort in one pass. No `--write`:
      # CI verifies, it never mutates the tree.
      - run: bun run lint

  typecheck:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      # Separate job from `lint` on purpose: Bun strips types at runtime and
      # never type-checks, and Biome does not either. `tsc --noEmit` across the
      # workspace projects (apps/api, apps/web, packages/*) is the ONLY thing in
      # the pipeline that enforces the "strict, no `any`" rule from the spec.
      - run: bun run typecheck

  test:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 15
    permissions:
      contents: read
    # The integration half of the suite runs Drizzle migrations and the
    # repository layer against a REAL Postgres, same major as production, rather
    # than a mock or an in-process substitute. Migrations, transactions, JSONB
    # and `ON CONFLICT` behaviour are exactly the things a fake would get wrong
    # silently. Upstream providers stay mocked at the HTTP boundary — the DB is
    # the only service container this repo needs.
    services:
      postgres:
        # Pinned to the major the schema targets (spec §4), matching the
        # `postgres` service in docker-compose.yml.
        image: postgres:16
        env:
          POSTGRES_USER: router
          POSTGRES_PASSWORD: router
          POSTGRES_DB: router
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U router -d router"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      # Read by the same Zod-validated env loader the container uses, so a test
      # run and a production boot resolve their connection the same way. Points
      # at the mapped host port above, not a compose network alias — the service
      # container is reachable on localhost from the job.
      #
      # Load-bearing, not a convenience: the migration, advisory-lock, retention
      # and readiness-probe suites gate themselves on this variable and would
      # otherwise skip into a green summary. `bin/test` fails the job outright
      # when CI is set and this is missing, rather than reporting a pass it did
      # not earn — deleting this line breaks the build instead of the coverage.
      DATABASE_URL: postgres://router:router@localhost:5432/router
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      # GitHub gates the job on the service's health check before any step runs,
      # so no wait-for-postgres loop is needed here. Migrations are applied by the
      # test bootstrap itself (idempotent, same code path as boot).
      - run: bin/test

  bench:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 10
    needs: test
    permissions:
      contents: read
    # Report, not a gate: CLAUDE.md non-negotiable 8 makes the <5ms p99 overhead budget a promise,
    # but a shared runner's noise is not a regression signal worth blocking a merge over (see
    # docs/idea/08-observability.md, "Verifying the budget"). `continue-on-error` keeps a slow-runner
    # day from failing CI while the numbers — and their delta from the committed bench/baseline.json
    # — stay visible in the job summary and as a downloadable artifact for every PR.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - name: bin/bench against the committed baseline
        run: bin/bench --json --baseline bench/baseline.json | tee bench-report.json
      - name: publish the numbers to the job summary
        if: always()
        run: |
          {
            echo '### bench: `router_overhead_seconds` vs `bench/baseline.json`'
            echo
            echo 'Re-baseline after an intentional perf change: `bin/bench --write-baseline bench/baseline.json`'
            echo '(see docs/idea/08-observability.md). This job never fails the build — it reports.'
            echo
            echo '```json'
            cat bench-report.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bench-report
          path: bench-report.json
          retention-days: 30

  build:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      # Builds both halves of the artifact the image ships: the Hono API bundle
      # (`bun build --target=bun`) and the SolidJS SPA (Vite), which the same
      # process serves as static assets. Runs on PRs too — a broken Vite build
      # or an unresolvable import must fail here, not inside the image job where
      # only main-branch pushes would notice.
      - run: bun run build
# NOTE: this workflow deliberately publishes NOTHING.
#
# Image builds happen only on a tagged release (.github/workflows/release.yml,
# triggered by `v*` tags). CI is purely the quality gate: lint, typecheck, test,
# build. An earlier revision also pushed a `<sha>` + `main` image on every push
# to main; that was removed on purpose. Do not reinstate it — a registry that
# accumulates an image per commit makes "which tag is real" ambiguous, and the
# release tag is the only ref anything should deploy.
#
# `build` above still runs on every push and PR, so a commit that cannot produce
# the artifact fails here rather than at release time.

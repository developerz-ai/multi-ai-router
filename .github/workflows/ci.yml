name: ci

on:
  push:
    branches: [main]
  pull_request:

# One CI run per ref. On a PR, a force-push or a new commit cancels the
# in-flight run — the older result is already stale by definition. On main it
# never does: release.yml's gate waits for this run's checks on the exact commit
# a tag names, and a second merge cancelling them would leave that commit with
# no verdict.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Pinned once here so lint/typecheck/test/build all agree on a runtime. Bun
  # minor releases change `bun test` and bundler behaviour often enough that
  # `latest` would make CI non-reproducible.
  #
  # THE DOCKERFILE PINS THE SAME VERSION, and that is enforced rather than asked
  # for: apps/api/test/integration/image-pins.test.ts reads this line and both
  # `FROM oven/bun:…` lines and fails when they disagree. Bumping this without
  # the Dockerfile — or the reverse — turns the `test` job red, so the image can
  # no longer ship a bun the suite never ran. Moving the pin is one commit across
  # both files plus a re-resolved digest; docs/RELEASING.md has the procedure.
  BUN_VERSION: "1.4.4"
  # Biome/Vite colourise when they detect a TTY; Actions is not one, so force it
  # for readable log output.
  FORCE_COLOR: "1"

# Default for every job: read-only. Jobs that push packages widen this locally.
permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      # `--frozen-lockfile` fails instead of silently rewriting bun.lock, so a
      # PR that edits a package.json without committing the lockfile is caught
      # here rather than producing a different dependency tree in the image.
      - run: bun install --frozen-lockfile
      # `biome check` is lint + format + import-sort in one pass. No `--write`:
      # CI verifies, it never mutates the tree.
      - run: bun run lint

  typecheck:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      # Separate job from `lint` on purpose: Bun strips types at runtime and
      # never type-checks, and Biome does not either. tsc over the solution
      # build plus the non-composite test/bench/tooling projects is the ONLY
      # thing in the pipeline that enforces the "strict, no `any`" rule — tests
      # included (apps/api/test/integration/typecheck-coverage.test.ts holds
      # every TypeScript file inside one of those projects).
      - run: bun run typecheck

  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    # The integration half of the suite runs Drizzle migrations and the
    # repository layer against PostgreSQL 18, the managed deployment major, rather
    # than a mock or an in-process substitute. Migrations, transactions, JSONB
    # and `ON CONFLICT` behaviour are exactly the things a fake would get wrong
    # silently. Upstream providers stay mocked at the HTTP boundary — the DB is
    # the only service container this repo needs.
    services:
      postgres:
        # PostgreSQL 18, the major both compose files ship. No other major is
        # exercised here; image-pins.test.ts holds this to the compose pin's major.
        image: postgres:18.6@sha256:5a5a84b19854a9ffaa54082c166ff4ec27473a361e496e5ea167f298f2da9722
        env:
          POSTGRES_USER: router
          POSTGRES_PASSWORD: router
          POSTGRES_DB: router
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U router -d router"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      # Read by the same Zod-validated env loader the container uses, so a test
      # run and a production boot resolve their connection the same way. Points
      # at the mapped host port above, not a compose network alias — the service
      # container is reachable on localhost from the job.
      #
      # Load-bearing, not a convenience: the migration, advisory-lock, retention
      # and readiness-probe suites gate themselves on this variable and would
      # otherwise skip into a green summary. The test run refuses to start when
      # CI is set and this is missing (apps/api/test/support/database-gate.ts),
      # rather than reporting a pass it did not earn — deleting this line breaks
      # the build instead of the coverage.
      #
      # It is set here as job env, which outranks every dotenv file, so this is
      # the value the run reads no matter what a checkout's .env* say.
      DATABASE_URL: postgres://router:router@localhost:5432/router
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      # GitHub gates the job on the service's health check before any step runs,
      # so no wait-for-postgres loop is needed here. Migrations are applied by the
      # test bootstrap itself (idempotent, same code path as boot).
      - name: install native test prerequisites
        run: |
          bin/ci-apt-mirror
          sudo apt-get update -o Acquire::Retries=3
          sudo apt-get install -y -o Acquire::Retries=3 --no-install-recommends gcc libc6-dev
      - run: bin/test

  advisory:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    # Gates main's colour and every release, not a merge: it is not a required check in branch
    # protection, because the assessment is live — it asks OSV.dev about the resolved packages in
    # bun.lock at the moment the job runs, so an advisory published today would otherwise block
    # every unrelated PR until an override lands. release.yml's gate does require it to be green
    # on the tagged commit, so a known-vulnerable dependency set is never published.
    #
    # There is no `continue-on-error` anywhere in this job, at job or step level. A finding fails
    # the job, and so does an assessment that could not complete (exit 2): a check that could not
    # reach the database has proved nothing about the dependency set, and a red "unknown" beats a
    # green "clean".
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      # The report is written on every outcome — clean, finding and unavailable alike — so every
      # run leaves evidence and the upload below never has nothing to upload.
      - run: bin/advisory --report advisory-report.json
      - name: publish the assessment status to the job summary
        if: always()
        run: |
          status="$(jq -r '.status // "unavailable"' advisory-report.json 2>/dev/null || echo unavailable)"
          {
            echo '### advisory — OSV.dev dependency assessment'
            echo
            echo "status: $status"
            echo
            echo '```json'
            cat advisory-report.json 2>/dev/null || echo '{"status":"unavailable","error":"no report was written"}'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          archive: true
          name: advisory-report
          path: advisory-report.json
          if-no-files-found: error
          retention-days: 30

  bench:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    # Report, not a gate: CLAUDE.md non-negotiable 8 makes both the <5ms p99 overhead budget and the
    # zero-added-TTFT promise real ceilings that `bin/bench` exits non-zero on, but a shared runner's
    # noise is not a regression signal worth blocking a merge over (see docs/idea/08-observability.md,
    # "Verifying the budget"). `continue-on-error` keeps a slow-runner day from failing CI while the
    # numbers — and their delta from the committed bench/baseline.json, for both halves of the budget
    # — stay visible in the job summary and as a downloadable artifact for every PR.
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - name: bin/bench against the committed baseline
        run: bin/bench --json --baseline bench/baseline.json | tee bench-report.json
      - name: publish the numbers to the job summary
        if: always()
        run: |
          {
            echo '### bench: `router_overhead_seconds` vs `bench/baseline.json`'
            echo
            echo 'Re-baseline after an intentional perf change: `bin/bench --write-baseline bench/baseline.json`'
            echo '(see docs/idea/08-observability.md). This job never fails the build — it reports.'
            echo
            echo '```json'
            cat bench-report.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          archive: true
          name: bench-report
          path: bench-report.json
          retention-days: 30

  ui-geometry:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    # A gate, not a report — the opposite deal from `bench` above, on purpose.
    # #62's cost-through-the-credential-pill fix was undone by #94 with CI green
    # because the geometry check was never committed; this job is that check,
    # committed, so it fails the PR and not the operator's morning. No
    # `continue-on-error` anywhere in it, at job or step level.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      # Determinism inputs, installed explicitly rather than inherited from the
      # runner image: DejaVu is the font stack bin/ui-geometry pins text metrics
      # to, and the browser build is whatever the pinned playwright in
      # package.json resolves to — never `latest`.
      # A dead mirror in the runner's apt list costs a DNS timeout per file, which outlasts the job
      # timeout; bin/ci-apt-mirror pins apt to archive.ubuntu.com when one does not resolve. The
      # installs below fail the step if a package is unreachable. `--with-deps` calls the same apt.
      - name: install pinned fonts and headless Chromium
        run: |
          bin/ci-apt-mirror
          sudo apt-get update -o Acquire::Retries=3
          sudo apt-get install -y -o Acquire::Retries=3 --no-install-recommends fonts-dejavu-core
          bunx playwright install --with-deps chromium
      - run: bin/ui-geometry

  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      # Builds both halves of the artifact the image ships: the Hono API bundle
      # (`bun build --target=bun`) and the SolidJS SPA (Vite), which the same
      # process serves as static assets. Runs on PRs too — a broken Vite build
      # or an unresolvable import must fail here, not inside the image job where
      # only main-branch pushes would notice.
      - name: install native build prerequisites
        run: |
          bin/ci-apt-mirror
          sudo apt-get update -o Acquire::Retries=3
          sudo apt-get install -y -o Acquire::Retries=3 --no-install-recommends gcc libc6-dev
      - run: bun run build

  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    # Builds the release Dockerfile for amd64 and never pushes it. The Dockerfile asserts a lot at
    # build time — the bun digest names its version, the `claude` binary is staged, the duplicate
    # prune still matches, the ownership probe and `tini` run, the Claude profile check resolves in
    # the pruned layout — and before this job those assertions first ran on a `v*` tag, after the
    # version number was already burned. A merged PR that breaks one now fails here.
    #
    # On pushes to main it also writes the `linux-amd64` gha layer cache: caches written from the
    # default branch are readable from tag refs, so release.yml's amd64 leg starts warm.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Build context is `.`; keep the checkout token out of it (as release.yml does).
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: build the release image without pushing it
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: false
          load: true
          tags: multi-ai-router:ci
          build-args: |
            ROUTER_REVISION=${{ github.sha }}
          cache-from: type=gha,scope=linux-amd64
          cache-to: ${{ github.event_name == 'push' && 'type=gha,mode=max,scope=linux-amd64' || '' }}
      # The image's own entrypoint chain, end to end: the bundled CLI the Agent SDK drives must
      # start in the runtime layer, not just exist in the builder.
      - name: the shipped claude CLI runs
        run: docker run --rm --entrypoint claude multi-ai-router:ci --version
# NOTE: this workflow deliberately publishes NOTHING.
#
# Image pushes happen only on a tagged release (.github/workflows/release.yml,
# triggered by `v*` tags, and only after its gate sees this workflow green on the
# tagged commit). CI is purely the quality gate: lint, typecheck, test, build,
# ui-geometry, the image build (`image`, never pushed), and the live dependency
# advisory assessment. An earlier revision also pushed a `<sha>` + `main` image
# on every push to main; that was removed on purpose. Do not reinstate it — a
# registry that accumulates an image per commit makes "which tag is real"
# ambiguous, and the release tag is the only ref anything should deploy.

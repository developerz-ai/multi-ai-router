name: release

on:
  push:
    tags: ["v*"]

# `contents: write` is needed by the github_release job (it creates the release);
# `packages: write` by the image jobs; `checks: read` by the gate; `id-token` +
# `attestations` by the provenance attestation in `merge`. Each job declares its
# own block below, which replaces this one for that job.
permissions:
  contents: write
  packages: write
  checks: read
  id-token: write
  attestations: write

# Releases are never cancelled mid-flight: a half-pushed manifest list or a
# release created without its image is worse than a queued run.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # Nothing is built until this passes. A release publishes `X.Y.Z`, `X.Y` and
  # possibly `latest` for whatever commit the tag names, so the tag must name a
  # commit main's CI already proved — on main, with every required check green
  # (bin/release-gate waits for checks still running: tags are routinely pushed
  # seconds after the merge). It also refuses a version that is already in the
  # registry: a re-pushed tag would otherwise silently move `X.Y.Z` to a new
  # digest under every operator pinned to it.
  gate:
    runs-on: ubuntu-24.04
    # bin/release-gate's own wait (RELEASE_GATE_TIMEOUT_SECONDS, 30 min) ends first.
    timeout-minutes: 40
    permissions:
      contents: read
      checks: read
      packages: read
    outputs:
      latest: ${{ steps.highest.outputs.latest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # History, so the gate can prove the tagged commit is an ancestor of main.
          fetch-depth: 0
      # A tag that does not name the version this tree reports must not reach the
      # registry. It checks `packages/core/src/version.ts` — the constant
      # `/healthz`, `router_build_info`, the boot log and the console footer all
      # read — and every workspace manifest against it, not just the root
      # `package.json`. Cheapest check first: it fails in a second.
      - name: verify the tag names the version this build reports
        run: bin/verify-version "${GITHUB_REF_NAME}"
      - name: require main's CI to have passed on the tagged commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: bin/release-gate "${GITHUB_SHA}"
      - name: log in to ghcr
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # A published version is immutable: operators pin `X.Y.Z` and expect the
      # same digest forever. A tag deleted and re-pushed would rebuild and move
      # it, so the fix for a bad release is always the next patch.
      - name: refuse a version that is already published
        run: |
          version="${GITHUB_REF_NAME#v}"
          if docker buildx imagetools inspect "${REGISTRY}/${IMAGE_NAME}:${version}" >/dev/null 2>&1; then
            echo "${REGISTRY}/${IMAGE_NAME}:${version} is already published — cut a new patch instead." >&2
            exit 1
          fi
      # `latest` (and the GitHub Release's "latest" badge) belong to the highest
      # stable version, not the last tag pushed: a patch on an older line cut
      # after a newer release must not move `docker compose pull` backwards
      # across a forward-only migration.
      - name: decide whether this is the highest stable version
        id: highest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          highest="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/tags?per_page=100" --jq '.[].name' |
            grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1)"
          if [ "$highest" = "$GITHUB_REF_NAME" ]; then latest=true; else latest=false; fi
          echo "highest stable tag: ${highest:-none}; ${GITHUB_REF_NAME} gets latest: $latest"
          echo "latest=$latest" >> "$GITHUB_OUTPUT"

  # Native per-arch build (amd64 + arm64), each pushed by digest, then merged
  # into one manifest list under the semver (+ `latest`) tags. ci.yml's `image`
  # job builds the same Dockerfile for amd64 on every PR and push without
  # pushing, so a broken Dockerfile assertion fails there, not here.
  #
  # Both arches build natively on GitHub-hosted runners (`ubuntu-24.04` and
  # `ubuntu-24.04-arm`), free for a public repository. No QEMU: an emulated
  # arm64 leg is several times slower and hides arch-specific failures.
  #
  # Layer cache: read-only here. Actions caches are visible only to the ref that
  # wrote them and to the default branch, so a cache written under one tag is
  # invisible to the next; ci.yml's `image` job writes the amd64 scope from main,
  # which every tag can read. arm64 has no main writer and builds cold.
  build:
    needs: [gate]
    runs-on: ${{ matrix.runner }}
    # Generous ceiling for both legs: a tag that changes bun.lock busts the
    # cached install layer and forces a cold dependency + SPA build.
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    strategy:
      # Let the other arch finish so an arch-specific break is identifiable.
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      # `linux/amd64` → `linux-amd64`: slashes are illegal in artifact names and
      # ambiguous in cache scopes.
      - name: prepare platform pair
        run: |
          platform="${{ matrix.platform }}"
          echo "PLATFORM_PAIR=${platform//\//-}" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Build context is `.`; keep the checkout token out of the build
          # workspace (matches ci.yml's image job).
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: log in to ghcr
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Labels only. Tags are applied once, by `merge`, to the manifest list.
      - name: image labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
      - name: build & push by digest
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          # Baked into the image as ROUTER_REVISION, so the running process can
          # report which commit it is (`router_build_info{revision}`, boot log).
          # The OCI label docker/metadata-action adds carries the same sha, but a
          # label is only readable from outside the container — an operator
          # reading a dashboard or a log line cannot see it.
          build-args: |
            ROUTER_REVISION=${{ github.sha }}
          # Read main's layers (ci.yml `image` writes linux-amd64). No cache-to:
          # a cache written under a tag ref is invisible to every later tag, so
          # exporting it cost two minutes per arch for nobody.
          cache-from: type=gha,scope=${{ env.PLATFORM_PAIR }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          # BuildKit provenance and SBOM attestations, attached to each arch's
          # image. These are unsigned; the signed statement is the
          # build-provenance attestation `merge` creates for the manifest list.
          provenance: true
          sbom: true
      - name: export digest
        run: |
          mkdir -p "${{ runner.temp }}/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"
      - name: upload digest
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          archive: true
          name: digests-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/digests/*
          # Never publish a "multi-arch" release that is secretly single-arch.
          if-no-files-found: error
          retention-days: 1

  merge:
    needs: [gate, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
      # Sigstore-signed build provenance, bound to this workflow's identity.
      id-token: write
      attestations: write
    steps:
      - name: download digests
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true
          digest-mismatch: error
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: log in to ghcr
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: derive image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # v1.2.3 → tags: 1.2.3, 1.2, and `latest` only when the gate found this
          # to be the highest stable version. Pre-releases (any tag containing a
          # hyphen: v1.3.0-rc.1) are never the highest stable, so a release
          # candidate never becomes the default pull for `docker compose up`.
          # `X.Y` on an older line still moves — it names that line.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ needs.gate.outputs.latest == 'true' }}
      - name: create manifest list & push
        working-directory: ${{ runner.temp }}/digests
        run: |
          # shellcheck disable=SC2046  # word-splitting is intentional: one -t per tag, one image ref per digest
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@sha256:%s ' *)
      - name: inspect
        id: inspect
        run: |
          ref="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}"
          docker buildx imagetools inspect "$ref"
          echo "digest=$(docker buildx imagetools inspect "$ref" --format '{{json .Manifest}}' | jq -r .digest)" >> "$GITHUB_OUTPUT"
      # Signed (Sigstore, workflow identity) build provenance for the manifest
      # list every tag points at, pushed beside it in the registry. Verify with
      # `gh attestation verify oci://ghcr.io/<repo>:<version> --repo <repo>`.
      - name: attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.inspect.outputs.digest }}
          push-to-registry: true

  # Last, and only after `merge`: the release notes advertise an image tag, so
  # the tag must already resolve when the release becomes visible.
  github_release:
    needs: [gate, merge]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      # The only job in this workflow that writes to the repo.
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: derive image version
        id: ver
        # Tag is vX.Y.Z; the published image tags drop the leading v
        # (docker/metadata-action semver pattern), so strip it for the body —
        # otherwise the notes point at ghcr...:vX.Y.Z, which does not exist.
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - name: create github release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          # Auto-generated changelog from merged PRs since the previous tag.
          generate_release_notes: true
          # Pre-release tags (v1.3.0-rc.1) are marked as such, matching the
          # `latest` suppression in `merge` above.
          prerelease: ${{ contains(github.ref_name, '-') }}
          # Same rule as the `latest` image tag: highest stable version only.
          make_latest: ${{ needs.gate.outputs.latest }}
          body: |
            Container images for this release are published to GitHub Container Registry:

            ```
            ghcr.io/${{ github.repository }}:${{ steps.ver.outputs.version }}
            ```

            See `README.md` for the quick start.

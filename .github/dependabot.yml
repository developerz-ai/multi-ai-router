# Weekly, with minor and patch updates grouped per ecosystem; a major update arrives on its own.
# Owner, 2026-11-26: weekly at most, grouped, quiet. Advisories come through here (dz devops.watch is
# off), and each ecosystem batches its security bumps into one PR via an `applies-to:
# security-updates` group. At most 3 open PRs per ecosystem.
# The 14-day cooldown lets a compromised release get caught before it reaches us. Security updates
# are unaffected.
version: 2
updates:
  - package-ecosystem: "bun"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "sunday"
      time: "16:00"
    open-pull-requests-limit: 3
    cooldown:
      default-days: 14
    groups:
      bun-minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
      bun-security:
        applies-to: security-updates
        patterns: ["*"]
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "sunday"
      time: "16:00"
    open-pull-requests-limit: 3
    cooldown:
      default-days: 14
    groups:
      docker-minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
      docker-security:
        applies-to: security-updates
        patterns: ["*"]
    ignore:
      # The bun image moves with .bun-version and ci.yml's BUN_VERSION as one change; the drift test
      # in apps/api/test/integration/image-pins.test.ts fails a bump of the image alone.
      - dependency-name: "oven/bun"
  - package-ecosystem: "docker-compose"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "sunday"
      time: "16:00"
    open-pull-requests-limit: 3
    cooldown:
      default-days: 14
    groups:
      docker-compose-minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
      docker-compose-security:
        applies-to: security-updates
        patterns: ["*"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "sunday"
      time: "16:00"
    open-pull-requests-limit: 3
    cooldown:
      default-days: 14
    groups:
      github-actions-minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
      github-actions-security:
        applies-to: security-updates
        patterns: ["*"]
